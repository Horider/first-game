<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Орки против лагеря</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b10; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; touch-action: none; }
      #game canvas { display: block; }
      #rotate {
        display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
        color: #e6b422; font: 16px/1.6 "Press Start 2P", monospace; text-align: center; padding: 24px;
        background: #0b0b10;
      }
      @media (orientation: portrait) and (max-width: 700px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Поверните устройство</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
